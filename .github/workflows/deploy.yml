name: Deploy to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build
        env:
          NITRO_PRESET: node-server

      - name: Generate static index.html
        run: |
          node .output/server/index.mjs &
          SERVER_PID=$!
          sleep 5
          curl -s http://localhost:3000/assc-formal-website/ -o .output/public/index.html
          curl -s http://localhost:3000/assc-formal-website/ -o .output/public/404.html
          kill $SERVER_PID

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Nitro static output directory is usually .output/public
          path: .output/public

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
